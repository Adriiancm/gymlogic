
<ion-header>
  <ion-toolbar>
    <ion-title>GymLog</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Mis ejercicios</h1>

  <ion-grid>
    <ion-row>
      <ion-col
        size="12"
        size-md="6"
        *ngFor="let ejercicio of listaDeEjercicios">

        <app-ejercicio-item
          [ejercicio]="ejercicio">
        </app-ejercicio-item>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
