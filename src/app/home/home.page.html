
<app-header></app-header>

<ion-content class="ion-padding">

  <h1>Mis ejercicios</h1>

  <!-- LISTA DE EJERCICIOS -->
  <ion-grid>
    <ion-row>
      <ion-col
        size="6"
        size-md="3"
        *ngFor="let ejercicio of listaDeEjercicios">

        <app-ejercicio-item
          [ejercicio]="ejercicio">
        </app-ejercicio-item>

      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- FORMULARIO PARA AÑADIR EJERCICIOS -->
  <h2>Añadir nuevo ejercicio</h2>

  <ion-list>

    <ion-item>
      <ion-input
        label="Nombre del ejercicio"
        label-placement="floating"
        placeholder="Ej. Press de banca"
        [(ngModel)]="nuevoEjercicio.nombre">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-select
        interface="popover"
        label="Grupo muscular"
        label-placement="floating"
        placeholder="Selecciona un grupo"
        [(ngModel)]="nuevoEjercicio.grupoMuscular">

        <ion-select-option value="Pecho">Pecho</ion-select-option>
        <ion-select-option value="Espalda">Espalda</ion-select-option>
        <ion-select-option value="Piernas">Piernas</ion-select-option>
        <ion-select-option value="Brazos">Brazos</ion-select-option>
        <ion-select-option value="Hombros">Hombros</ion-select-option>
        <ion-select-option value="Espalda y piernas">Espalda y piernas</ion-select-option>

      </ion-select>
    </ion-item>

    <ion-item>
      <ion-select
        interface="popover"
        label="Dificultad"
        label-placement="floating"
        [(ngModel)]="nuevoEjercicio.dificultad">

        <ion-select-option value="Principiante">Principiante</ion-select-option>
        <ion-select-option value="Intermedio">Intermedio</ion-select-option>
        <ion-select-option value="Avanzado">Avanzado</ion-select-option>

      </ion-select>
    </ion-item>

    <ion-item>
      <ion-input
        type="date"
        label="Fecha de registro"
        label-placement="floating"
        [(ngModel)]="nuevoEjercicio.fechaRegistro">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Notas adicionales"
        label-placement="floating"
        placeholder="Añade observaciones sobre el ejercicio..."
        [autoGrow]="true"
        [(ngModel)]="nuevoEjercicio.descripcion">
      </ion-textarea>
    </ion-item>

  </ion-list>

  <ion-button
    expand="block"
    (click)="agregarEjercicio()"
    class="ion-margin-top ion-margin-bottom">

    <ion-icon name="add-outline" slot="start"></ion-icon>
    Añadir ejercicio

  </ion-button>

</ion-content>
