<ion-header>
  <ion-toolbar>
    <ion-title>
      <div class="logo-gymlog">
        <ion-icon name="barbell-outline"></ion-icon>
        <span>GymLog</span>
      </div>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Mis ejercicios</h1>

  <ion-button expand="block" (click)="anadirEjercicio()">
    <ion-icon name="add-outline" slot="start"></ion-icon>
    Añadir ejercicio
  </ion-button>

  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="3" *ngFor="let ejercicio of listaDeEjercicios">

        <app-ejercicio-item [ejercicio]="ejercicio">
        </app-ejercicio-item>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
