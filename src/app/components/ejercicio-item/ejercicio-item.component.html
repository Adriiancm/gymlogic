<ng-container *ngIf="ejercicio as item">
  <ion-card [class.ejercicio-favorito]="item.favorito">

    <img [src]="item.imagen" [alt]="'Imagen de ' + item.nombre" class="imagen-ejercicio" />

    <ion-item lines="none">
      <ion-label>
        <h2>{{ item.nombre }}</h2>
        <p>Grupo muscular: {{ item.grupoMuscular }}</p>
        <p>Dificultad: {{ item.dificultad }}</p>
      </ion-label>

      <ion-button slot="end" fill="clear" [color]="item.favorito ? 'danger' : 'medium'" (click)="alternarFavorito()"
        [attr.aria-label]="item.favorito ? 'Quitar de favoritos' : 'Añadir a favoritos'">
        <ion-icon [name]="item.favorito ? 'heart' : 'heart-outline'">
        </ion-icon>
      </ion-button>
    </ion-item>

    <ion-card-content>
      <p>{{ item.descripcion }}</p>

      <p>
        Registrado:
        {{ item.fechaRegistro | date:'dd/MM/yyyy' }}
      </p>
    </ion-card-content>

  </ion-card>
</ng-container>
