<ion-card>
  <ion-item>
    <ion-label>
      <h2>{{ ejercicio.nombre }}</h2>
      <p>Grupo muscular: {{ ejercicio.grupoMuscular }}</p>
      <p>Dificultad: {{ ejercicio.dificultad }}</p>
    </ion-label>
  </ion-item>

  <ion-card-content>
    <p>{{ ejercicio.descripcion }}</p>



    <p>
      Registrado:
      {{ ejercicio.fechaRegistro | date:'dd/MM/yyyy' }}
    </p>


  </ion-card-content>
</ion-card>
